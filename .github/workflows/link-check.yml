name: Link Check

on:
  schedule:
    - cron: '0 6 1 * *'
  workflow_dispatch:
  pull_request:
    paths:
      - 'README.md'

jobs:
  check-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check all links in README
        uses: lycheeverse/lychee-action@v2
        with:
          args: --verbose --no-progress --max-concurrency 4 README.md
          fail: false
